version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /requirements
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-python:
        patterns: ["*"]
