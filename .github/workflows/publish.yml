name: Publish to PyPI

# Publishes via PyPI Trusted Publishing (OIDC) — no API token or stored secret.
# One repo, two PyPI projects, chosen by the release tag:
# - `vX.Y.Z`             → vld8, built from the repo root
# - `scrutineer-vX.Y.Z`  → scrutineer, the forwarding package in legacy/scrutineer
# Each PyPI project's trusted publisher names this repo, this workflow file and
# the `pypi` environment. The environment waits for Cyrus's approval and lets
# only `v*` and `scrutineer-v*` tags deploy.
# `workflow_dispatch` re-publishes an existing tag by hand. Run it from the tag,
# `gh workflow run publish.yml --ref vX.Y.Z -f tag=vX.Y.Z`, because the
# environment refuses branch refs.
# Either way, the tag's commit must already be on main.
# Create the scrutineer release with `--latest=false`, so the repo's latest
# release (and the README badge) stays on vld8.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z or scrutineer-vX.Y.Z)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi   # required reviewer; PyPI accepts tokens from this environment only
    permissions:
      contents: read    # checkout
      id-token: write   # required for OIDC trusted publishing
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0   # full history, for the main-ancestry check below
      - name: Only publish what's on main
        # Feature work lands on staging; main receives releases only. A release
        # tag on a commit that never reached main (a staging or feature commit)
        # must not reach PyPI.
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG points at $(git rev-parse --short HEAD), which is not on main. Release from main only."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Build sdist + wheel
        run: |
          case "$TAG" in
            scrutineer-v*) dir=legacy/scrutineer; want="${TAG#scrutineer-v}"; pkg=scrutineer ;;
            v*)            dir=.;                 want="${TAG#v}";            pkg=vld8 ;;
            *) echo "::error::tag '$TAG' is neither vX.Y.Z nor scrutineer-vX.Y.Z"; exit 1 ;;
          esac
          python -m pip install --upgrade build
          python -m build --outdir dist "$dir"
          # Refuse to publish a version the tag doesn't name.
          if [ ! -f "dist/${pkg}-${want}-py3-none-any.whl" ]; then
            echo "::error::tag $TAG does not match the built version:"; ls dist; exit 1
          fi
          # The forwarding package requires vld8; publishing it first would leave
          # `pip install -U scrutineer` unresolvable. Check the floor is live.
          if [ "$pkg" = scrutineer ]; then
            floor=$(sed -n 's/.*"vld8>=\([0-9.]*\),.*/\1/p' legacy/scrutineer/pyproject.toml)
            if ! curl -fsS -o /dev/null "https://pypi.org/pypi/vld8/${floor}/json"; then
              echo "::error::vld8 ${floor} is not on PyPI yet; publish v${floor} first"; exit 1
            fi
          fi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
