name: Publish to PyPI

# Publishes via PyPI Trusted Publishing (OIDC) — no API token or stored secret.
# - `release: published`  → cutting a GitHub release ships that version automatically.
# - `workflow_dispatch`   → run manually from the Actions tab (used for the first publish,
#                           since the v1.5.0 release was created before this workflow existed).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
