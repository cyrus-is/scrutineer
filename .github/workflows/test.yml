name: Tests

# Runs every suite on each PR and on main. The wheel step builds and installs the
# package exactly as a user gets it from PyPI, because the install-path defects that
# prompted this workflow only appear when no clone is present.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install "pyyaml>=6.0,<7.0" build
      - name: Generator and CLI tests
        run: |
          python tests/test_generators.py
          python tests/test_cli.py
      - name: MCP review tests
        working-directory: mcp-review
        run: |
          python tests/test_analyze_mcp.py
          python tests/test_fetch_source.py
          python tests/test_capture_runtime.py
      - name: Wheel install smoke test
        run: |
          python -m build --wheel --outdir dist .
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          mkdir /tmp/target && cd /tmp/target && git init -q && echo 'export const x = 1;' > index.ts
          /tmp/wheel-venv/bin/scrutineer install /tmp/target
          test -f .claude/commands/scrutineer-setup.md
          # `! grep` would never fail the step under `set -e`, so test explicitly.
          if grep -l '\.venv/bin/python' .claude/commands/*.md; then exit 1; fi
          /tmp/wheel-venv/bin/scrutineer mcp analyze --help > /dev/null
          test -f "$(/tmp/wheel-venv/bin/scrutineer servicemap schema)"
          echo '{}' > bad.json
          if /tmp/wheel-venv/bin/scrutineer servicemap validate bad.json > /dev/null; then exit 1; fi
