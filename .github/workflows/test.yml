name: Tests

# Runs every suite on each PR and on main. The wheel step builds and installs the
# package exactly as a user gets it from PyPI, because the install-path defects that
# prompted this workflow only appear when no clone is present.
on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/requirements/ci-constraints.txt
    strategy:
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: build cython hatchling ruff setuptools wheel
          python -m pip install --require-hashes --no-build-isolation pyyaml
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Generator and CLI tests
        run: |
          python tests/test_generators.py
          python tests/test_snapshots.py
          python tests/test_cli.py
          python tests/test_legacy_shim.py
          python tests/test_servicemap.py
          python tests/test_findings.py
          python tests/test_review_report.py
          python tests/test_checks.py
          python tests/test_prepare_trust.py
      - name: MCP review tests
        working-directory: mcp-review
        run: |
          python tests/test_analyze_mcp.py
          python tests/test_fetch_source.py
          python tests/test_capture_runtime.py
      - name: Wheel install smoke test
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          python -m build --wheel --no-isolation --outdir "$work/dist" .
          python -m build --wheel --no-isolation --outdir "$work/dist" legacy/scrutineer
          python -m pip wheel --require-hashes --no-build-isolation --no-deps --wheel-dir "$work/dist" pyyaml
          python -m venv "$work/wheel-venv"
          # Both wheels at once, so the forwarding package's vld8 requirement
          # resolves to the wheel just built rather than to PyPI.
          PIP_CONSTRAINT= "$work/wheel-venv/bin/pip" install --no-index --find-links "$work/dist" "$work/dist"/vld8-*.whl "$work/dist"/scrutineer-*.whl
          pkg_version=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          mkdir "$work/target" && cd "$work/target" && git init -q && echo 'export const x = 1;' > index.ts
          mkdir -p .claude/commands
          printf -- '---\nname: scrutineer-mcp\n---\n' > .claude/commands/scrutineer-mcp.md
          "$work/wheel-venv/bin/vld8" install "$work/target"
          test "$("$work/wheel-venv/bin/vld8" --version)" = "vld8 $pkg_version"
          test -f .claude/commands/vld8-setup.md
          test ! -e .claude/commands/scrutineer-mcp.md
          test -f .claude/scrutineer-backup/scrutineer-mcp.md
          # `! grep` would never fail the step under `set -e`, so test explicitly.
          if grep -l '\.venv/bin/python' .claude/commands/*.md; then exit 1; fi
          if grep -il 'scrutineer' .claude/commands/*.md; then exit 1; fi
          "$work/wheel-venv/bin/vld8" mcp analyze --help > /dev/null
          "$work/wheel-venv/bin/vld8" checks --help > /dev/null
          "$work/wheel-venv/bin/vld8" checks --changed index.ts --repo "$work/target" > /dev/null
          "$work/wheel-venv/bin/vld8" review size --help > /dev/null
          "$work/wheel-venv/bin/vld8" review report --help > /dev/null
          test -f "$("$work/wheel-venv/bin/vld8" map schema)"
          echo '{}' > bad.json
          if "$work/wheel-venv/bin/vld8" map validate bad.json > /dev/null; then exit 1; fi
          # The old command still works through the forwarding package.
          test -f "$("$work/wheel-venv/bin/scrutineer" servicemap schema 2>/dev/null)"
          "$work/wheel-venv/bin/scrutineer" mcp analyze --help > /dev/null
