[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vld8"
version = "2.0.1"
description = "Dev tooling for Claude Code: a service map, context-aware code and security review, and an MCP-server reviewer. Formerly scrutineer."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/cyrus-is/vld8"
Issues = "https://github.com/cyrus-is/vld8/issues"

[project.scripts]
vld8 = "vld8.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vld8"]

# Bundle the runtime assets into the wheel under vld8/_assets/ without
# moving them in the source tree (the servicemap/mcp skills reference them by
# repo-relative paths). vld8/paths.py resolves _assets/ when installed and
# the repo-root siblings when run from a clone or `pip install -e .`.
#
# Listed per-file on purpose: force-include bypasses `exclude`, so enumerating
# the runtime essentials is the only way to keep tests/READMEs out of the wheel.
[tool.hatch.build.targets.wheel.force-include]
"generate-peer-review/generate.py" = "vld8/_assets/generate-peer-review/generate.py"
"generate-peer-review/peer_review_guidance.yaml" = "vld8/_assets/generate-peer-review/peer_review_guidance.yaml"
"generate-security-review/generate.py" = "vld8/_assets/generate-security-review/generate.py"
"generate-security-review/security_guidance.yaml" = "vld8/_assets/generate-security-review/security_guidance.yaml"
"generate-servicemap/SKILL.md" = "vld8/_assets/generate-servicemap/SKILL.md"
"generate-servicemap/validate_servicemap.py" = "vld8/_assets/generate-servicemap/validate_servicemap.py"
"mcp-review/SKILL.md" = "vld8/_assets/mcp-review/SKILL.md"
"mcp-review/analyze_mcp.py" = "vld8/_assets/mcp-review/analyze_mcp.py"
"mcp-review/fetch_source.py" = "vld8/_assets/mcp-review/fetch_source.py"
"mcp-review/validate_findings.py" = "vld8/_assets/mcp-review/validate_findings.py"
"mcp-review/capture_runtime.py" = "vld8/_assets/mcp-review/capture_runtime.py"
"mcp-review/mcp_risk_guidance.yaml" = "vld8/_assets/mcp-review/mcp_risk_guidance.yaml"
"references/schema.md" = "vld8/_assets/references/schema.md"
"vld8-setup/SKILL.md" = "vld8/_assets/vld8-setup/SKILL.md"

[tool.hatch.build.targets.sdist]
include = [
    "vld8/",
    "generate-peer-review/",
    "generate-security-review/",
    "generate-servicemap/",
    "mcp-review/",
    "references/",
    "vld8-setup/",
    "/README.md",
    "/LICENSE*",
]
# The entire test tree — unit tests, fixtures, and the MCP eval corpus
# (live-captured tool surfaces, the top-100 survey, capture scripts) — is a
# repo-only dev/regression asset. Keep it in git, never ship it in the PyPI
# sdist. (The wheel already excludes it via the force-include allowlist.)
exclude = [
    "mcp-review/tests",
    "mcp-review/tests/**",
    "**/.DS_Store",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"generate-peer-review/generate.py" = ["E501"]      # Embedded Markdown prompt templates exceed 88 columns.
"generate-security-review/generate.py" = ["E501"]  # Embedded Markdown prompt templates exceed 88 columns.
"legacy/scrutineer/scrutineer/cli.py" = ["E501"]   # Frozen forwarding package; pre-existing long notice line.
"mcp-review/analyze_mcp.py" = ["E501"]             # Pre-existing long regexes and guidance strings.
"mcp-review/capture_runtime.py" = ["E501"]         # Pre-existing long lines in runtime capture harness.
"mcp-review/fetch_source.py" = ["E501"]            # Pre-existing long lines in archive source fetcher.
"mcp-review/validate_findings.py" = ["E501"]       # Pre-existing long lines in MCP findings validator.
"mcp-review/tests/**/*.py" = ["E501"]              # Pre-existing long fixture and test assertion lines.
"tests/test_cli.py" = ["E501"]                     # Pre-existing long CLI test assertion lines.
"tests/test_generators.py" = ["E501"]              # Pre-existing long generator test assertion lines.
"tests/test_legacy_shim.py" = ["E501"]             # Pre-existing long forwarding-shim test lines.

[tool.ruff.format]
# Pre-existing files pending a dedicated formatting pass (#149); all new files and
# vld8/, generate-servicemap/, legacy/, tests/test_{findings,servicemap}.py are
# checked by `ruff format --check .` in CI.
exclude = [
    "generate-peer-review/generate.py",
    "generate-security-review/generate.py",
    "mcp-review/analyze_mcp.py",
    "mcp-review/capture_runtime.py",
    "mcp-review/fetch_source.py",
    "mcp-review/validate_findings.py",
    "mcp-review/tests/corpus/capture_tools.py",
    "mcp-review/tests/corpus/top100/survey_build.py",
    "mcp-review/tests/corpus/top100/validate_all.py",
    "mcp-review/tests/fixtures/servers/drift_server.py",
    "mcp-review/tests/fixtures/servers/exfil_server.py",
    "mcp-review/tests/test_analyze_mcp.py",
    "mcp-review/tests/test_capture_runtime.py",
    "mcp-review/tests/test_fetch_source.py",
    "tests/test_cli.py",
    "tests/test_generators.py",
    "tests/test_legacy_shim.py",
]
