patterns:
  - id: "swift-ffi-fixed-buffer-length"
    title: "Unchecked Swift buffer length at a native API boundary"
    vulnerable_pattern: >-
      Attacker-controlled `Data` reaches `withUnsafeBytes`, `baseAddress`, or an
      `Unsafe*Pointer` passed to a C or Objective-C function that assumes a
      compile-time buffer size, without an exact count check before the handoff.
    verify: >-
      Trace the value from an external source to the native declaration; confirm
      that the callee has no authoritative length parameter or assumes a fixed
      size, and that no dominating guard enforces that size.
    safe_when: >-
      The Swift wrapper rejects every non-exact length before obtaining the
      pointer, or the native callee receives and validates an authoritative
      length before any read or write.
    secure_alternative: >-
      Add an exact `guard data.count == expectedLength else { throw ... }`
      before entering `withUnsafeBytes`, and fail closed with a typed error.
    evidence: ["GHSA-9m44-rr2w-ppp7"]
    security_review:
      enabled: true
      owasp: "M4:2024 Insufficient Input/Output Validation"
      severity_if_found: "HIGH"
    peer_review:
      enabled: true
      lens: "correctness"
      severity: "issue"
      failure_mode: "A short or oversized buffer can cause an out-of-bounds native read/write, crash, or memory disclosure despite otherwise safe Swift."

  - id: "swift-jwt-algorithm-verification"
    title: "JWT verification accepts a missing or `none` algorithm"
    vulnerable_pattern: >-
      JWT/JWS verification accepts a missing `alg`, treats `alg=none` as valid by
      default, accepts `none` together with signature bytes, or chooses the
      verification algorithm solely from the untrusted token header.
    verify: >-
      Follow the token through the actual verification call and its default
      validators; confirm that the caller does not enforce the expected
      algorithm and that the decoded claims affect authentication or authorization.
    safe_when: >-
      An explicit allowlist requires the expected asymmetric or MAC algorithm,
      rejects missing/`none` values and contradictory signature state, and the
      signature is verified before claims are trusted.
    secure_alternative: >-
      Require an application-controlled algorithm allowlist, reject missing and
      `none` algorithms by default, reject `alg=none` when any signature is
      present, and verify before consuming claims.
    evidence: ["GHSA-88q6-jcjg-hvmw"]
    security_review:
      enabled: true
      owasp: "M3:2024 Insecure Authentication/Authorization"
      severity_if_found: "HIGH"
    peer_review:
      enabled: true
      lens: "correctness"
      severity: "issue"
      failure_mode: "A forged unsigned token can be treated as verified and grant the attacker the victim's identity or privileges."

  - id: "swift-untrusted-parser-trap"
    title: "Untrusted parser input reaches a Swift trap"
    vulnerable_pattern: >-
      Network, file, certificate, or protocol bytes can reach
      `preconditionFailure`, `fatalError`, a force unwrap, or an unchecked array
      subscript/range because the parser assumes an internal state or minimum length.
    verify: >-
      Demonstrate the attacker-controlled byte sequence and confirm that ordinary
      malformed input, rather than a programmer-only invariant, reaches the trap.
    safe_when: >-
      The trapping operation is dominated by complete bounds and state validation,
      or the input is constructed exclusively inside the trusted process and cannot
      cross a serialization boundary.
    secure_alternative: >-
      Convert malformed-input paths to typed thrown errors or failable parsing;
      compute end offsets safely, guard them against `count`, and regression-test
      empty, truncated, oversized, and protocol-invalid inputs.
    evidence: ["GHSA-r3fr-7m74-q7g2", "GHSA-w8xv-rwgf-4fwh"]
    security_review:
      enabled: false
    peer_review:
      enabled: true
      lens: "production-reliability"
      severity: "issue"
      failure_mode: "Malformed remote input terminates the app or connection instead of producing a recoverable parse error."

  - id: "swift-protocol-parser-fail-closed"
    title: "Protocol parser resumes after an invalid frame"
    vulnerable_pattern: >-
      A failed frame initializer, unknown frame type, invalid protocol-version
      combination, or partial payload is logged and processing then resumes on
      the same connection or dispatches partially initialized state.
    verify: >-
      Trace every parse-failure branch and confirm whether it disconnects/throws
      before another read or delegate callback; check version-specific empty-field
      rules rather than assuming one layout for every protocol version.
    safe_when: >-
      The protocol explicitly defines recoverable resynchronization and the code
      proves a new trusted frame boundary before processing continues.
    secure_alternative: >-
      Centralize protocol-error handling, stop dispatch immediately, close or
      reset the connection safely, and validate version-specific invariants before
      slicing or force-unwrapping fields.
    evidence: ["GHSA-r3fr-7m74-q7g2"]
    security_review:
      enabled: false
    peer_review:
      enabled: true
      lens: "correctness"
      severity: "issue"
      failure_mode: "The parser can crash, desynchronize the stream, or deliver invalid state after malformed network input."

  - id: "swift-terminal-control-sequence-reflection"
    title: "Terminal control state is reflected back to an untrusted host"
    vulnerable_pattern: >-
      A terminal emulator stores attacker-controlled title or malformed control
      sequence content and later includes that content in a device-status/control
      response sent back to the terminal host or injected into an input stream.
    verify: >-
      Trace remote terminal bytes into stored UI/control state and then into
      `sendResponse`, keyboard input, paste, or command-line data without treating
      escape/control bytes as hostile.
    safe_when: >-
      The response is a fixed protocol constant, omits attacker-controlled state,
      or a protocol-correct encoder proves that control bytes cannot become input.
    secure_alternative: >-
      Do not echo terminal titles or invalid control payloads in responses; return
      the minimal constant response required by the protocol and keep display
      state separate from host-bound input.
    evidence: ["GHSA-jq43-q8mx-r7mq"]
    security_review:
      enabled: true
      owasp: "M4:2024 Insufficient Input/Output Validation"
      severity_if_found: "HIGH"
    peer_review:
      enabled: true
      lens: "correctness"
      severity: "issue"
      failure_mode: "A malicious terminal stream can replay stored escape content as user input and cause unintended command execution."

  - id: "swift-archive-entry-containment"
    title: "Archive entry escapes its extraction root"
    vulnerable_pattern: >-
      An archive member path is appended to a destination `URL`, or checked only
      with a lexical `absoluteString.hasPrefix`, without rejecting absolute paths,
      parent traversal, repeated separators, and path-component boundary tricks.
    verify: >-
      Follow the decoded archive name through every normalization step to the file
      creation call and test `../`, absolute paths, doubled separators, prefix
      siblings such as `/safe2`, and platform-specific separators.
    safe_when: >-
      The implementation rejects dangerous components before creation and proves
      the standardized destination remains a descendant of the extraction root
      using path components rather than an unbounded string prefix.
    secure_alternative: >-
      Reject absolute and parent components, normalize separators and the final
      file URL, then enforce a component-boundary containment check immediately
      before opening or creating the file.
    evidence: ["GHSA-c2cc-3569-6jh2"]
    security_review:
      enabled: true
      owasp: "M4:2024 Insufficient Input/Output Validation"
      severity_if_found: "HIGH"
    peer_review:
      enabled: true
      lens: "data-integrity"
      severity: "issue"
      failure_mode: "A crafted archive can overwrite files outside the user-selected destination."

  - id: "swift-archive-symlink-containment"
    title: "Archive extraction follows an escaping symlink"
    vulnerable_pattern: >-
      Archive extraction creates or follows symlink entries without proving that
      their target and every traversed path component remain inside the extraction
      root, or it allows symlinks by default for untrusted archives.
    verify: >-
      Test absolute and relative link targets, links through a pre-existing
      intermediate symlink, link-then-file ordering, and time-of-check/time-of-use
      replacement before the final write.
    safe_when: >-
      Symlinks are rejected for untrusted archives, or descriptor-relative/no-follow
      operations and per-component checks prevent both target escape and symlink hops.
    secure_alternative: >-
      Reject symlink entries by default; if required, resolve relative targets from
      the link parent, enforce root containment, and create descendants without
      following attacker-controlled intermediate symlinks.
    evidence: ["GHSA-c2cc-3569-6jh2"]
    security_review:
      enabled: true
      owasp: "M4:2024 Insufficient Input/Output Validation"
      severity_if_found: "HIGH"
    peer_review:
      enabled: true
      lens: "data-integrity"
      severity: "issue"
      failure_mode: "A crafted archive symlink redirects later writes outside the extraction directory."

  - id: "swift-cbc-random-iv"
    title: "CBC encryption reuses a fixed or predictable IV"
    vulnerable_pattern: >-
      New AES-CBC encryption uses a static IV such as a string literal, makes
      random IVs an opt-in/disabled option, uses non-cryptographic randomness, or
      ignores the return status from `SecRandomCopyBytes`/`CCRandomGenerateBytes`.
    verify: >-
      Confirm this is encryption rather than legacy-only decryption, the mode is
      CBC, and the IV can repeat or be predicted for messages under the same key.
    safe_when: >-
      A fresh block-sized IV comes from the platform CSPRNG for every encryption,
      RNG failure aborts encryption, and the IV is stored alongside the ciphertext;
      deterministic nonce derivation is used only by a construction that specifies it.
    secure_alternative: >-
      Make the recommended/default encryptor generate a fresh IV with
      `SecRandomCopyBytes` or `CCRandomGenerateBytes`, check success, and confine
      fixed-IV behavior to explicit legacy decryption compatibility.
    evidence: ["GHSA-5844-q3fc-56rh"]
    security_review:
      enabled: true
      owasp: "M10:2024 Insufficient Cryptography"
      severity_if_found: "HIGH"
    peer_review:
      enabled: true
      lens: "correctness"
      severity: "issue"
      failure_mode: "Repeated IVs leak plaintext relationships and make otherwise correct CBC encryption insecure."

  - id: "ios-webview-bridge-exact-trust"
    title: "WKWebView bridge grants native capability to a broad page set"
    vulnerable_pattern: >-
      A `WKScriptMessageHandler` dispatches privileged native actions after only
      checking that the page is local-network, uses HTTP(S), has an allowlisted
      scheme/host, or was reached through generic navigation; trust survives later
      navigation or is not bound to the exact capability-backed document.
    verify: >-
      Trace every navigation path and message callback; compare the message frame's
      effective origin/document with the exact URL or capability provisioned by
      trusted native code, including redirects, subframes, fragments, ports, paths,
      and state reset on navigation.
    safe_when: >-
      The handler exposes no privileged action, or dispatch requires an exact
      normalized trusted document/capability established out of band and that trust
      is cleared by every generic navigation.
    secure_alternative: >-
      Default bridge trust to false, grant it only on an authenticated/capability
      navigation, normalize scheme and host while preserving security-relevant
      port/path/query, validate at message dispatch, and clear trust on all other loads.
    evidence: ["GHSA-4p4f-fc8q-84m3"]
    security_review:
      enabled: true
      owasp: "M8:2024 Security Misconfiguration"
      severity_if_found: "HIGH"
    peer_review:
      enabled: true
      lens: "architecture"
      severity: "issue"
      failure_mode: "A generic or attacker-controlled web page can invoke native agent, credential, filesystem, or device actions."

  - id: "ios-discovery-metadata-trust"
    title: "Unauthenticated discovery metadata controls routing or TLS trust"
    vulnerable_pattern: >-
      Bonjour/mDNS TXT fields choose a host, port, or certificate fingerprint,
      override a previously stored pin, or trigger automatic connection to a newly
      discovered service without explicit user trust.
    verify: >-
      Separate authenticated data from discovery hints; trace TXT values into URL
      construction, TLS challenge handling, pin storage/precedence, TOFU, and
      autoconnect selection.
    safe_when: >-
      Routing uses the resolved SRV plus A/AAAA endpoint, stored pins always win,
      first trust requires explicit user intent or authenticated discovery, and
      automatic reconnection is limited to a previously trusted stable identity.
    secure_alternative: >-
      Treat TXT records as display hints only, resolve the advertised service for
      routing, never accept a discovered fingerprint over a stored pin, make TOFU
      explicit, and require an existing trust record before autoconnect.
    evidence: ["GHSA-pv58-549p-qh99"]
    security_review:
      enabled: true
      owasp: "M5:2024 Insecure Communication"
      severity_if_found: "HIGH"
    peer_review:
      enabled: true
      lens: "architecture"
      severity: "issue"
      failure_mode: "An attacker on the local network can steer the app to an attacker endpoint and replace or bypass TLS identity."
